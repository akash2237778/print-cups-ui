<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPrint Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="bg-white rounded-xl shadow-lg p-8 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center mb-6 text-slate-700">QuickPrint Portal</h1>

        <div id="dropzone" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center cursor-pointer hover:bg-slate-50 transition-colors mb-6">
            <svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-sm font-medium text-slate-600">Drag & Drop file here</p>
            <p class="text-xs text-slate-400 mt-1">PDF, PNG, JPEG</p>
            <input type="file" id="fileInput" class="hidden" accept=".pdf,image/*">
        </div>

        <form id="printForm" class="hidden space-y-4">
            <div class="bg-blue-50 p-3 rounded-md mb-4 flex justify-between items-center">
                <span id="fileNameDisplay" class="text-sm font-semibold text-blue-700 truncate"></span>
                <button type="button" id="clearFile" class="text-blue-500 hover:text-blue-700 text-xs font-bold">✕</button>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Printer</label>
                <select id="printerSelect" class="w-full border-slate-300 rounded-md shadow-sm border p-2 text-sm focus:ring-blue-500 focus:border-blue-500" required>
                    <option value="" disabled selected>Loading printers...</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Copies</label>
                    <input type="number" id="copiesInput" min="1" max="50" value="1" class="w-full border-slate-300 rounded-md shadow-sm border p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Color Mode</label>
                    <select id="colorMode" class="w-full border-slate-300 rounded-md shadow-sm border p-2 text-sm">
                        <option value="color">Color</option>
                        <option value="grayscale">Grayscale</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Sides</label>
                <select id="sidesSelect" class="w-full border-slate-300 rounded-md shadow-sm border p-2 text-sm">
                    <option value="one-sided">Single Sided</option>
                    <option value="two-sided-long-edge">Double Sided (Long Edge)</option>
                    <option value="two-sided-short-edge">Double Sided (Short Edge)</option>
                </select>
            </div>

            <button type="submit" id="printBtn" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors mt-4">
                Print Document
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-md"></div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const printForm = document.getElementById('printForm');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const clearFile = document.getElementById('clearFile');
        const printerSelect = document.getElementById('printerSelect');
        const statusMessage = document.getElementById('statusMessage');
        const printBtn = document.getElementById('printBtn');

        let currentFile = null;

        // Fetch Printers on Load
        async function loadPrinters() {
            try {
                const res = await fetch('/printers');
                if (!res.ok) throw new Error('Failed to connect to CUPS');
                const data = await res.json();
                
                printerSelect.innerHTML = '';
                if (data.printers.length === 0) {
                    printerSelect.innerHTML = '<option disabled>No printers found</option>';
                    return;
                }
                data.printers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.textContent = p;
                    printerSelect.appendChild(opt);
                });
            } catch (err) {
                printerSelect.innerHTML = '<option disabled>Error loading printers</option>';
                showStatus('Error communicating with print server.', 'error');
            }
        }
        loadPrinters();

        // Drag and Drop Logic
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });

        ['dragenter', 'dragover'].forEach(evt => {
            dropzone.addEventListener(evt, () => dropzone.classList.add('border-blue-500', 'bg-blue-50'));
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, () => dropzone.classList.remove('border-blue-500', 'bg-blue-50'));
        });

        dropzone.addEventListener('drop', e => {
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            currentFile = file;
            fileNameDisplay.textContent = file.name;
            dropzone.classList.add('hidden');
            printForm.classList.remove('hidden');
            hideStatus();
        }

        clearFile.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            printForm.classList.add('hidden');
            dropzone.classList.remove('hidden');
        });

        // Form Submit Logic
        printForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (!currentFile || !printerSelect.value) return;

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('printer', printerSelect.value);
            formData.append('copies', document.getElementById('copiesInput').value);
            formData.append('sides', document.getElementById('sidesSelect').value);
            formData.append('color_mode', document.getElementById('colorMode').value);

            printBtn.disabled = true;
            printBtn.textContent = 'Printing...';
            hideStatus();

            try {
                const res = await fetch('/print', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok) {
                    showStatus('Success! Job sent to printer.', 'success');
                    setTimeout(() => clearFile.click(), 3000); // Reset after 3 sec
                } else {
                    showStatus(data.detail || 'Print failed.', 'error');
                }
            } catch (err) {
                showStatus('Network error occurred.', 'error');
            } finally {
                printBtn.disabled = false;
                printBtn.textContent = 'Print Document';
            }
        });

        function showStatus(msg, type) {
            statusMessage.textContent = msg;
            statusMessage.className = `mt-4 text-center text-sm font-medium p-3 rounded-md block ${
                type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
            }`;
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
